<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Xiangqi - Custom Rooms</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xiangqi.js/0.1.1/xiangqi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/trystero/dist/trystero-torrent.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #1a252f; color: #fff; padding: 20px; }
    .card { background: #2c3e50; max-width: 480px; margin: 0 auto; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    input { padding: 10px; font-size: 16px; border-radius: 4px; border: none; width: 60%; margin-right: 5px; }
    button { padding: 10px 16px; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:hover { background: #27ae60; }
    #status { font-weight: bold; margin-top: 15px; color: #f1c40f; }
    #board { display: grid; grid-template-columns: repeat(9, 45px); grid-template-rows: repeat(10, 45px); gap: 2px; justify-content: center; margin-top: 20px; }
    .cell { width: 45px; height: 45px; background: #e67e22; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; user-select: none; }
    .selected { background: #f1c40f; color: #000; }
    .r { color: #c0392b; text-shadow: 1px 1px 1px #000; }
    .b { color: #2c3e50; text-shadow: 1px 1px 1px #fff; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Online Xiangqi</h2>
    <div>
      <input type="text" id="room-input" placeholder="Type room code (e.g. myroom123)" />
      <button onclick="joinCustomRoom()">Enter Room</button>
    </div>
    <div id="status">Enter a custom room name to play.</div>
  </div>

  <div id="board"></div>

  <script>
    const game = new Xiangqi();
    const symbols = {'r':'車','n':'馬','b':'象','a':'士','k':'將','c':'砲','p':'卒','R':'車','N':'馬','B':'相','A':'仕','K':'帥','C':'炮','P':'兵'};
    
    let room = null;
    let sendMove = null;
    let getMove = null;
    let myColor = 'r';
    let selected = null;

    function joinCustomRoom() {
      const roomCode = document.getElementById('room-input').value.trim().toLowerCase();
      if (!roomCode) return alert("Please type a room code first!");

      document.getElementById('status').innerText = `Connecting to room "${roomCode}"...`;

      // Connect using Trystero
      room = window.trystero.joinRoom({appId: 'xiangqi-custom-p2p', password: roomCode});
      [sendMove, getMove] = room.makeAction('move');

      // First person in room plays Red, second person plays Black
      room.onPeerJoin(peerId => {
        myColor = 'r';
        document.getElementById('status').innerText = `Opponent joined room "${roomCode}"! You are RED. Your turn.`;
        render();
      });

      getMove((data) => {
        game.move(data);
        render();
        document.getElementById('status').innerText = "Opponent moved! Your turn.";
      });

      document.getElementById('status').innerText = `In room "${roomCode}". Waiting for opponent to join...`;
      render();
    }

    function render() {
      const b = document.getElementById('board');
      b.innerHTML = '';
      const state = game.board();
      const files = ['a','b','c','d','e','f','g','h','i'];

      for (let r = 9; r >= 0; r--) {
        for (let c = 0; c < 9; c++) {
          const sq = files[c] + r;
          const piece = state[9 - r][c];
          const cell = document.createElement('div');
          cell.className = 'cell' + (selected === sq ? ' selected' : '');
          if (piece) cell.innerHTML = `<span class="${piece.color}">${symbols[piece.type]}</span>`;
          
          cell.onclick = () => {
            if (!sendMove) return alert("Please enter a room code first!");
            
            if (!selected) {
              if (piece && piece.color === myColor) { 
                selected = sq; 
                render(); 
              }
            } else {
              const m = game.move({from: selected, to: sq});
              selected = null;
              if (m) {
                sendMove({from: m.from, to: m.to});
                document.getElementById('status').innerText = "Move sent. Waiting for opponent...";
              }
              render();
            }
          };
          b.appendChild(cell);
        }
      }
    }

    render();
  </script>
</body>
</html>
